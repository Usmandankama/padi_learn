<!DOCTYPE html>
<html>
<head>
  <script>
    // Keeps passkeys_web from killing the app on load.
    //
    // passkeys_web is a transitive dependency (supabase_flutter -> passkeys ->
    // passkeys_web). Its registerWith() calls PasskeyAuthenticator.init()
    // unconditionally, behind a guard that cannot fire: it does
    //   try { window['PasskeyAuthenticator'] } catch (_) { ...warn... }
    // and reading a missing key returns undefined rather than throwing. So on
    // any page without Corbado's bundle.js the call lands on undefined, the
    // error is thrown during plugin registration — before the first frame —
    // and the whole app renders as a blank white page with no visible cause.
    //
    // PadiLearn does not offer passkeys: sign-in is email/password, Google and
    // Apple through Supabase. Rather than ship a third-party SDK for a feature
    // we do not use, this declares the global the plugin expects. init() is a
    // no-op; everything else rejects loudly, so if passkeys are ever adopted
    // on web this fails with a real message instead of pretending to work.
    //
    // To actually support passkeys on web, replace this with Corbado's bundle:
    //   https://github.com/corbado/flutter-passkeys/releases
    window.PasskeyAuthenticator = window.PasskeyAuthenticator || {
      init: function () {},
      register: function () { return Promise.reject(new Error('Passkeys are not enabled on PadiLearn web.')); },
      login: function () { return Promise.reject(new Error('Passkeys are not enabled on PadiLearn web.')); },
      cancelCurrentAuthenticatorOperation: function () {},
      isUserVerifyingPlatformAuthenticatorAvailable: function () { return Promise.resolve(false); }
    };
  </script>
