# 1536m could not get through JetifyTransform on the Flutter engine jars —
# the build died with "Java heap space" partway through assembleDebug.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Jetifier deliberately left off. It rewrites *every* dependency jar looking
# for legacy android.support references, which is what exhausted the heap
# above, and nothing here needs it: all Flutter plugins in use are AndroidX
# native. Turn it back on only if a dependency genuinely still ships support
# library classes, and raise the heap further if you do.
android.enableJetifier=false
